# Services d'infrastructure (semaine 2). Images à reconfirmer et figer par digest lors de la mise en route.
# Les services applicatifs (API, UI, VLM, serveur MCP) seront ajoutés aux semaines 3 à 6.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  # Stockage objet compatible S3. MinIO ne publie plus d'images librement accessibles (pull refusé en 2026) :
  # remplacé par SeaweedFS (licence Apache 2.0), même API S3, même code client (boto3).
  s3:
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?à définir dans .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?à définir dans .env}
    entrypoint: ["/bin/sh", "-c", "mkdir -p /etc/seaweedfs && printf '{\"identities\":[{\"name\":\"maintidoc\",\"credentials\":[{\"accessKey\":\"%s\",\"secretKey\":\"%s\"}],\"actions\":[\"Admin\",\"Read\",\"Write\",\"List\",\"Tagging\"]}]}' \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" > /etc/seaweedfs/s3.json && exec /entrypoint.sh \"$$@\"", "--"]
    ports: ["127.0.0.1:8333:8333"]
    volumes: [s3_data:/data]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    ports: ["127.0.0.1:5000:5000"]
    volumes: [mlflow_data:/mlflow]

volumes:
  postgres_data:
  qdrant_data:
  s3_data:
  mlflow_data:
