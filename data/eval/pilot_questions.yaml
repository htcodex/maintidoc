# 30 questions pilotes annotées (semaine 2) — évaluation de la recherche.
# Un élément récupéré est pertinent s'il appartient au document et à la page indiqués et, si `types` est donné,
# s'il est de l'un de ces types (paragraph, table, figure, page, ocr_text, photo).
# user : identité utilisée pour la recherche (le filtre d'accès s'applique). Par défaut u_resp_01, qui voit
# les deux familles : c'est le cas le plus difficile (confusion pompes / compresseurs possible).
# photo : chemin (relatif à corpus/) d'une photo jointe à la question.
# categorie : texte | tableau | figure | ocr | photo | piege
questions:
